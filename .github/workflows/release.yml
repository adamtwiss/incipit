# Release builds, one binary per OS family and architecture, each checked
# with `bench` against the latest Bench: trailer, then attached to a draft
# GitHub release when a v* tag is pushed. Run it by hand (Actions tab ->
# release -> Run workflow) to get the binaries as artifacts without a release.
#
#   linux-x86-64, windows-x86-64.exe  x86-64-v3 (AVX2, BMI2; Haswell / Zen 1
#       on); AVX-512 (+VNNI) NNUE kernels and PEXT (not on Zen 1/2) chosen at
#       start-up. Windows is cross-compiled with MinGW.
#   linux-aarch64  ARMv8.0 baseline (NEON), cross-compiled, checked under QEMU.
#   linux-aarch64-musl  the same, linked statically against musl instead of
#       glibc, for systems without glibc such as Android (e.g. Termux). Built
#       and checked natively on an arm64 runner with Ubuntu's musl-tools.
#   macos-arm64  Apple Silicon (built for apple-m1).
#   macos-x86-64  Intel Macs (x86-64-v3); checked under Rosetta.
# `bench` prints the indexing and kernels each machine chose.
name: release

on:
  push:
    # Version tags only (v0.5.0): net-hosting tags must never start a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu qemu-user-static
          rustup target add x86_64-pc-windows-gnu aarch64-unknown-linux-gnu

      - name: Net
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: make net

      - name: Build
        working-directory: engine
        run: |
          net="$PWD/$(basename "$(cat net.txt)")"
          ver=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --always)
          mkdir -p ../dist
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-gnu; do
            if [ $target = x86_64-pc-windows-gnu ]; then cc=x86_64-w64-mingw32-gcc; os=windows; ext=.exe
            else cc=cc; os=linux; ext=; fi
            CC=$cc EVALFILE="$net" RUSTFLAGS="-Ctarget-cpu=x86-64-v3 -Ctarget-feature=+crt-static" \
              cargo build --release --target $target
            cp target/$target/release/incipit$ext ../dist/incipit-$ver-$os-x86-64$ext
          done
          CC=aarch64-linux-gnu-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            EVALFILE="$net" RUSTFLAGS="-Ctarget-feature=+crt-static" \
            cargo build --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/incipit ../dist/incipit-$ver-linux-aarch64
          ls -l ../dist

      - name: Check Linux builds
        run: |
          want=$(git log -50 --format=%B | sed -n 's/^Bench: \([0-9]*\)$/\1/p' | head -1)
          for f in dist/*-linux-x86-64 dist/*-linux-aarch64; do
            run=; case $f in *aarch64) run=qemu-aarch64-static ;; esac
            out=$($run "$f" bench | tail -2)
            echo "$out" | head -1
            got=$(echo "$out" | tail -1 | cut -d' ' -f1)
            echo "$f: bench $got (want $want)"
            [ "$got" = "$want" ]
          done

      - uses: actions/upload-artifact@v4
        with:
          name: incipit
          path: dist/

  linux-arm-musl:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
      - name: Net
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: make net
      - name: Build
        working-directory: engine
        run: |
          net="$PWD/$(basename "$(cat net.txt)")"
          ver=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --always)
          # musl-gcc compiles the vendored Fathom code against musl's headers;
          # Rust links its own static musl. AR: there is no musl-ar.
          CC=musl-gcc AR=ar EVALFILE="$net" RUSTFLAGS="-Ctarget-feature=+crt-static" \
            cargo build --release --target aarch64-unknown-linux-musl
          mkdir -p ../dist
          cp target/aarch64-unknown-linux-musl/release/incipit ../dist/incipit-$ver-linux-aarch64-musl
          file ../dist/*
      - name: Bench the musl build
        run: |
          want=$(git log -50 --format=%B | sed -n 's/^Bench: \([0-9]*\)$/\1/p' | head -1)
          out=$(dist/*-linux-aarch64-musl bench | tail -2)
          echo "$out" | head -1
          got=$(echo "$out" | tail -1 | cut -d' ' -f1)
          echo "musl: bench $got (want $want)"
          [ "$got" = "$want" ]
      - uses: actions/upload-artifact@v4
        with:
          name: incipit-linux-arm-musl
          path: dist/

  check-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/download-artifact@v4
        with:
          name: incipit
          path: dist
      - name: Bench the Windows builds
        shell: bash
        run: |
          want=$(git log -50 --format=%B | sed -n 's/^Bench: \([0-9]*\)$/\1/p' | head -1)
          for f in dist/*-windows-x86-64.exe; do
            "$f" bench | tail -2 | head -1
            got=$("$f" bench | tail -1 | cut -d' ' -f1)
            echo "$f: bench $got (want $want)"
            [ "$got" = "$want" ]
          done

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Toolchains
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Net
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: make net
      - name: Build (arm64 and x86-64, one binary each)
        working-directory: engine
        run: |
          net="$PWD/$(basename "$(cat net.txt)")"
          ver=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --always)
          EVALFILE="$net" RUSTFLAGS="-Ctarget-cpu=apple-m1" cargo build --release --target aarch64-apple-darwin
          EVALFILE="$net" RUSTFLAGS="-Ctarget-cpu=x86-64-v3" cargo build --release --target x86_64-apple-darwin
          mkdir -p ../dist
          # Two binaries rather than one universal (lipo) file: each slice of a
          # universal binary embeds its own copy of the net, doubling the size.
          cp target/aarch64-apple-darwin/release/incipit ../dist/incipit-$ver-macos-arm64
          cp target/x86_64-apple-darwin/release/incipit ../dist/incipit-$ver-macos-x86-64
          file ../dist/incipit-$ver-macos-*
      - name: Bench the arm64 build
        run: |
          want=$(git log -50 --format=%B | sed -n 's/^Bench: \([0-9]*\)$/\1/p' | head -1)
          out=$(dist/*-macos-arm64 bench | tail -2)
          echo "$out" | head -1
          got=$(echo "$out" | tail -1 | cut -d' ' -f1)
          echo "arm64: bench $got (want $want)"
          [ "$got" = "$want" ]
      - uses: actions/upload-artifact@v4
        with:
          name: incipit-macos
          path: dist/

  check-macos-intel:
    # No Intel macOS runners any more: the x86-64 build runs under Rosetta
    # (macOS 15's supports AVX2), which checks the binary is valid and
    # complete, not its speed.
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/download-artifact@v4
        with:
          name: incipit-macos
          path: dist
      - name: Bench the x86-64 build
        run: |
          chmod +x dist/*-macos-x86-64
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          want=$(git log -50 --format=%B | sed -n 's/^Bench: \([0-9]*\)$/\1/p' | head -1)
          out=$(arch -x86_64 dist/*-macos-x86-64 bench | tail -2)
          echo "$out" | head -1
          got=$(echo "$out" | tail -1 | cut -d' ' -f1)
          echo "x86-64: bench $got (want $want)"
          [ "$got" = "$want" ]

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, check-windows, linux-arm-musl, macos, check-macos-intel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: incipit*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --draft --title "Incipit ${{ github.ref_name }}" --generate-notes
