[package]
name = "incipit-train"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Bullet (https://github.com/jw1912/bullet), from a checkout next to this repo
# (e.g. ~/code/bullet_incipit). Training needs a GPU: build on the GPU host.
[dependencies]
bullet_lib = { path = "../../bullet_incipit/crates/bullet_lib", features = ["cuda"] }

[profile.release]
opt-level = 3
